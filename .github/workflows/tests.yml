name: Tests

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  clean-up:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-15, macos-26, xcode-27]

    steps:
      - name: Project Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Check disk space (before)
        run: |
            df -h

      - name: Check iOS simulators
        run: |
          xcrun simctl list devices
          xcrun simctl runtime list

      - name: Remove iOS simulators
        run: |

          space_before=$(df -k "$GITHUB_WORKSPACE" | awk 'NR == 2 {print $4}')

          xcrun simctl shutdown all
          xcrun simctl delete all
          xcrun simctl runtime delete all

          # Runtime deletion is asynchronous; wait up to about 60 seconds.
          for ((attempt = 0; attempt < 30; attempt++)); do
            remaining=$(xcrun simctl runtime list -j | jq 'length')
            echo "Runtime images remaining: $remaining"

            if [[ "$remaining" == 0 ]]; then
              break
            fi
            sleep 2
          done

          if [[ "$remaining" != 0 ]]; then
            echo "::warning::Runtime deletion did not finish within the polling period."
          fi

          space_after=$(df -k "$GITHUB_WORKSPACE" | awk 'NR == 2 {print $4}')
          echo "Increase in available disk space: $((space_after - space_before)) KiB"

      - name: Check disk space (after)
        run: |
            df -h
